---
name: CI

"on": [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.30.2
      KUBECONFORM_VERSION: v0.6.4
      # sha256 of kubeconform-linux-amd64.tar.gz from the v0.6.4 CHECKSUMS file
      KUBECONFORM_SHA256: 2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      # Installed from the upstream release rather than via a marketplace
      # action: the previously referenced yannh/kubeconform-action does not
      # exist, so every CI run failed at "Prepare all required actions" with
      # "Unable to resolve action yannh/kubeconform-action".
      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform kubeconform.tar.gz
          kubeconform -v

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      # Both overlays are validated: prod is what users apply, dev carries the
      # metrics-server patch and so can break independently.
      - name: Render and validate the prod overlay
        run: kubectl kustomize kustomize/overlays/prod | kubeconform -strict -

      - name: Render and validate the dev overlay
        run: kubectl kustomize kustomize/overlays/dev | kubeconform -strict -

      # shellcheck also runs as part of pre-commit above; this step names it
      # explicitly so a shell failure is obvious in the job summary.
      - name: Shellcheck scripts/smoke.sh
        run: pre-commit run shellcheck --all-files
